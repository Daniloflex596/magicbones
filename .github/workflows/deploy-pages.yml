name: Deploy to GitHub Pages

# Pubblica su https://daniloflex596.github.io/magicbones/ tramite il branch
# `gh-pages`. Non usiamo actions/deploy-pages perché il GITHUB_TOKEN del
# workflow non può CREARE il sito Pages ("Resource not accessible by
# integration"): il branch invece lo auto-provisiona e funziona.

on:
  push:
    branches:
      - claude/immersive-web-engine-skill-iq4uc8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (base path /magicbones/)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      # Senza .nojekyll, Jekyll ignora le cartelle che iniziano con "_"
      # (cioè _astro/) e il sito arriva senza CSS né JS.
      - name: Disable Jekyll
        run: touch dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          commit_message: "Deploy: ${{ github.event.head_commit.message }}"
