<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500&display=swap');
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    width: 1200px; height: 630px;
    background:
      radial-gradient(ellipse at 30% 20%, #2f2438 0%, transparent 55%),
      radial-gradient(ellipse at 75% 80%, #3a2418 0%, transparent 50%),
      linear-gradient(180deg, #0c0f1a 0%, #05060b 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: 'Jost', sans-serif;
    position: relative;
    overflow: hidden;
  }
  .eyebrow {
    font-family: 'Jost', sans-serif;
    color: #ff8a4d;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    font-size: 20px;
    margin-bottom: 18px;
  }
  h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: 110px;
    color: #e4d9b8;
    letter-spacing: 0.01em;
  }
  p.tag {
    font-size: 24px;
    color: rgba(228,217,184,0.75);
    margin-top: 22px;
    letter-spacing: 0.04em;
  }
  .dot { position:absolute; border-radius:50%; background:#ff8a4d; opacity:0.8; }
</style>
</head>
<body>
  <div class="dot" style="width:6px;height:6px;top:120px;left:180px;"></div>
  <div class="dot" style="width:4px;height:4px;top:220px;left:980px;"></div>
  <div class="dot" style="width:5px;height:5px;top:500px;left:220px;"></div>
  <div class="dot" style="width:7px;height:7px;top:460px;left:1000px;"></div>
  <div class="dot" style="width:3px;height:3px;top:90px;left:700px;"></div>
  <p class="eyebrow">Claudia Capitani · Roma</p>
  <h1>Magic Bones</h1>
  <p class="tag">Un bosco notturno di ossa e magia</p>
</body>
</html>
