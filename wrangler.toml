# Cloudflare Workers con file statici: il sito è la cartella site/, le
# richieste /api/… (l'app Bottega) passano da worker.js → lib/api.js.
# Si pubblica da solo a ogni commit su main (Workers Builds: npx wrangler deploy).
# I valori segreti (PIN_BOTTEGA, SEGRETO, CHIAVE_GITHUB) NON stanno qui: si
# impostano nel pannello di Cloudflare → Settings → Variables and Secrets.
name = "magicbones"
main = "worker.js"
compatibility_date = "2025-09-01"
# le variabili messe a mano nel pannello di Cloudflare non vengono cancellate
# dalle pubblicazioni automatiche (senza questo, a ogni commit sparivano)
keep_vars = true

[assets]
directory = "./site"
binding = "ASSETS"
# pagina "Non trovata" vera (site/404.html), con codice 404
not_found_handling = "404-page"
# queste richieste passano dal codice (worker.js) prima dei file statici
run_worker_first = ["/api/*", "/data/pezzi.js", "/assets/img/pezzi/*", "/assets/video/*", "/assets/reel/*"]

[vars]
# (Cloudflare non accetta nomi che iniziano con GITHUB_)
ARCHIVIO_GITHUB = "Daniloflex596/magicbones"
RAMO_GITHUB = "main"
